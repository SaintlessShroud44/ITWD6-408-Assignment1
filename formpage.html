  <!-- =====================================================
       SUPABASE JAVASCRIPT
  ====================================================== -->

  <script type="module">


    //--------------------------------------------------------
    // Supabase client setup
    //--------------------------------------------------------

    import { createClient }
      from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';


    //--------------------------------------------------------
    // Supabase project URL
    //--------------------------------------------------------

    const supabaseUrl =
      'https://utboewzqywmyajznylwj.supabase.co';


    //--------------------------------------------------------
    // Supabase publishable key
    //--------------------------------------------------------

    const supabaseKey =
      'sb_publishable_4Sv6IprZ8zq4SF0cH0AzCw_ewWZRl2P';


    //--------------------------------------------------------
    // Create Supabase client
    //--------------------------------------------------------

    const supabase =
      createClient(
        supabaseUrl,
        supabaseKey
      );



    //--------------------------------------------------------
    // Get the form
    //--------------------------------------------------------

    const form =
      document.forms['mobile-techno-form'];



    //--------------------------------------------------------
    // Handle form submission
    //--------------------------------------------------------

    form.addEventListener(
      'submit',
      async (e) => {


        //----------------------------------------------------
        // Stop normal form submission
        //----------------------------------------------------

        e.preventDefault();



        //----------------------------------------------------
        // Get First Name
        //----------------------------------------------------

        const fname =
          document
            .getElementById('fname')
            .value
            .trim();



        //----------------------------------------------------
        // Get Last Name
        //----------------------------------------------------

        const lname =
          document
            .getElementById('lname')
            .value
            .trim();



        //----------------------------------------------------
        // Get Line 1
        //----------------------------------------------------

        const line1 =
          document
            .getElementById('line1')
            .value
            .trim();



        //----------------------------------------------------
        // Get Line 2
        //----------------------------------------------------

        const line2 =
          document
            .getElementById('line2')
            .value
            .trim();



        //----------------------------------------------------
        // Get Town / City
        //----------------------------------------------------

        const towncity =
          document
            .getElementById('towncity')
            .value
            .trim();



        //----------------------------------------------------
        // Get Gender
        //----------------------------------------------------

        const selectedGender =
          document.querySelector(
            'input[name="gridRadios"]:checked'
          );


        const gender =
          selectedGender
            ? selectedGender.value
            : '';



        //----------------------------------------------------
        // Get Mobile Phone Type
        //----------------------------------------------------

        const selectedMobileTypes =
          document.querySelectorAll(
            'input[name="mobileType"]:checked'
          );


        const mobileType =
          Array
            .from(selectedMobileTypes)
            .map(
              checkbox => checkbox.value
            )
            .join(', ');



        //----------------------------------------------------
        // Get Mobile Provider
        //----------------------------------------------------

        const mobileProvider =
          document
            .getElementById('mobileProvider')
            .value;



        //----------------------------------------------------
        // Get Study Use
        //----------------------------------------------------

        const studyuse =
          document
            .getElementById('studyuse')
            .value
            .trim();



        //----------------------------------------------------
        // Display values in console
        //----------------------------------------------------

        console.log(
          'First Name:',
          fname
        );

        console.log(
          'Last Name:',
          lname
        );

        console.log(
          'Line 1:',
          line1
        );

        console.log(
          'Line 2:',
          line2
        );

        console.log(
          'Town/City:',
          towncity
        );

        console.log(
          'Gender:',
          gender
        );

        console.log(
          'Mobile Phone Type:',
          mobileType
        );

        console.log(
          'Mobile Provider:',
          mobileProvider
        );

        console.log(
          'Study Use:',
          studyuse
        );



        //----------------------------------------------------
        // Validate form
        //----------------------------------------------------

        if (
          !fname ||
          !lname ||
          !line1 ||
          !towncity ||
          !gender ||
          !mobileType ||
          !mobileProvider ||
          !studyuse
        ) {


          alert(
            'Please fill in all required fields.'
          );


          return;

        }



        //----------------------------------------------------
        // Supabase authentication
        //----------------------------------------------------

        const email =
          'shawnpeipi@gmail.com';


        const password =
          'shawn1234';



        //----------------------------------------------------
        // Authenticate user
        //----------------------------------------------------

        const authentication =
          await authenticateUser(
            email,
            password
          );



        //----------------------------------------------------
        // Stop if authentication failed
        //----------------------------------------------------

        if (!authentication) {

          return;

        }



        //----------------------------------------------------
        // Insert data
        //----------------------------------------------------

        await insertData(
          fname,
          lname,
          line1,
          line2,
          towncity,
          gender,
          mobileType,
          mobileProvider,
          studyuse
        );


      }
    );



    //--------------------------------------------------------
    // Insert data into Supabase
    //--------------------------------------------------------

    async function insertData(
      fname,
      lname,
      line1,
      line2,
      towncity,
      gender,
      mobileType,
      mobileProvider,
      studyuse
    ) {


      //------------------------------------------------------
      // Insert into mobiletechnologyform table
      //------------------------------------------------------

      const { data, error } =
        await supabase
          .from('mobiletechnologyform')
          .insert([

            {

              fname: fname,

              lname: lname,

              gender: gender,

              line_1: line1,

              line_2: line2,

              'town/city': towncity,

              Mobile_Phone_Type: mobileType,

              Mobile_Provider: mobileProvider,

              studyuse: studyuse

            }

          ]);



      //------------------------------------------------------
      // Check for errors
      //------------------------------------------------------

      if (error) {


        console.error(
          'Supabase error:',
          error
        );


        alert(
          'Supabase Error:\n\n' +
          error.message
        );


        return null;

      }



      //------------------------------------------------------
      // Successful submission
      //------------------------------------------------------

      alert(
        'Data for ' +
        fname +
        ' ' +
        lname +
        ' inserted successfully!'
      );


      console.log(
        'Inserted data:',
        data
      );


      return data;


    }



    //--------------------------------------------------------
    // Authenticate user with Supabase
    //--------------------------------------------------------

    async function authenticateUser(
      email,
      password
    ) {


      try {


        //----------------------------------------------------
        // Sign in
        //----------------------------------------------------

        const { data, error } =
          await supabase.auth.signInWithPassword({

            email: email,

            password: password

          });



        //----------------------------------------------------
        // Check authentication error
        //----------------------------------------------------

        if (error) {


          console.error(
            'Authentication error:',
            error
          );


          alert(
            'Authentication failed:\n\n' +
            error.message
          );


          return null;

        }



        //----------------------------------------------------
        // Return authenticated data
        //----------------------------------------------------

        return data;


      }


      catch (error) {


        console.error(
          'Unexpected authentication error:',
          error
        );


        alert(
          'Authentication error:\n\n' +
          error.message
        );


        return null;

      }


    }


  </script>
